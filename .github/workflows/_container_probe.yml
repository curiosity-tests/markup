# racecar CONTAINER PROBE -- not a measured target.
#
# Question: can a `jobs.<id>.container` job be instrumented at all? It governs
# ~147 jobs across ~41 repos, and no other single run generalises that far.
#
# The image is deliberately GENERIC. A project-specific image would confound
# "container: is broken" with "this image lacks something" -- the exact ambiguity
# the probe exists to remove. debian:13 provably satisfies the documented
# bash + glibc requirement and still ships no runc, so either outcome is
# unambiguous. An already-scheduled run would be corroboration, not the
# experiment.
#
# Read PER ARM:
#   instrumented fails at the ASSERT, baseline green  -> container blocks instrumentation
#   both green                                        -> containers ARE instrumented;
#                                                        the earlier failure was image-specific
#   both fail in the BUILD                            -> says nothing about containers
name: container-probe

on:
  workflow_dispatch:
    inputs:
      leg:
        description: baseline (uninstrumented) or instrumented (under chalk/curiosity)
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

run-name: "container-probe ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

permissions:
  contents: read
  id-token: write

env:
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      # UNGATED and identical on both arms: an asymmetric setup cost between arms
      # would bias exactly the comparison this probe is for.
    - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
      shell: sh
      run: |
        command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
        apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash

    - name: Record the container's own facts (ungated, both arms)
      shell: sh
      run: |
        echo "image:  $(cat /etc/os-release | grep PRETTY_NAME || true)"
        echo "libc:   $(ldd --version 2>&1 | head -1)"
        echo "bash:   $(command -v bash || echo ABSENT)"
        echo "curl:   $(command -v curl || echo ABSENT)"
        echo "runc:   $(command -v runc || echo ABSENT)"
        echo "docker: $(command -v docker || echo ABSENT)"

    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false

    - name: Build something real
      run: |
        apt-get install -y -qq gcc
        printf 'int main(void){return 0;}\n' > /tmp/p.c
        gcc -O2 -o /tmp/p /tmp/p.c
        /tmp/p && echo "compiled and ran"
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
